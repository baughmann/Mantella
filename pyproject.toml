[project]
name = "mantella"
version = "0.14"
description = "Speak with NPCs in Skyrim and Fallout 4 using speech-to-text, LLMs and text-to-speech"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = "==3.11.*"
# Mirrors requirements.txt. Keep the two in sync until requirements.txt is retired.
dependencies = [
    "setuptools<82",
    "pandas==1.5.3",
    "tiktoken==0.4.0",
    "httpx==0.27.2",
    "openai==2.8.0",
    "aiohttp==3.8.4",
    "faster-whisper==1.0.3",
    "requests==2.31.0",
    "pyaudio==0.2.13",
    "soundfile==0.12.1",
    "numpy==1.25.0",
    "charset-normalizer==3.2.0",
    "fastapi==0.110.2",
    "huggingface_hub<0.25",
    "gradio==4.28.3",
    "pywin32==306; platform_system == 'Windows'",
    "mss==9.0.1",
    "opencv-python-headless==4.10.0.84",
    "sounddevice==0.5.1",
    "regex",
    "silero-vad-lite",
    "playsound",
    "useful-moonshine-onnx",
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.27.0",
    "opentelemetry-exporter-otlp-proto-http==1.27.0",
    "opentelemetry-instrumentation-requests==0.48b0",
    "opentelemetry-instrumentation-logging==0.48b0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-timeout",
]
docs = [
    "sphinx==7.2.6",
    "myst-parser==2.0.0",
    "sphinx-design==0.5.0",
    "sphinxcontrib-youtube==1.4.1",
    "furo==2023.9.10",
]

[tool.uv]
# Mantella is an app, not a library: don't build or install it into the venv.
package = false
# Mantella only runs on Windows; lock for Windows only.
environments = ["sys_platform == 'win32'"]
# playsound 1.3.0 ships only an sdist whose setup.py fails to build; 1.2.2 has a wheel and the same API.
override-dependencies = ["playsound==1.2.2"]
# moonshine-onnx's setup.py imports pkg_resources, which setuptools 81 removed.
build-constraint-dependencies = ["setuptools<81"]

[tool.uv.sources]
useful-moonshine-onnx = { git = "https://github.com/usefulsensors/moonshine.git", rev = "2f6282347950c8d711bd7319287babb87ec5a92d", subdirectory = "moonshine-onnx" }
